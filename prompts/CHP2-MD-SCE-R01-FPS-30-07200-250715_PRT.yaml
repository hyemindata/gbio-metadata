prompt:
  - A photo-realistic landscape photograph of the California redwood forest at midday, with bright sunlight piercing through the tall redwoods and illuminating a waterfall cascading down a moss-covered rock face. The sunlight creates a beautiful contrast between the dark, ancient trees and the vibrant greenery surrounding the waterfall. High quality, detail-rich, 8K.
  - A serene underwater photo of a rocky reef covered in orange and pink corals, softly lit by the morning light filtering through the surface. The sandy bottom of the ocean floor reflects the gentle golden light, contrasting with the vibrant corals and the deep blue of the surrounding water. High quality, detail-rich, 8K.
  - A photo-realistic landscape photograph of Monterey Bay at sunrise, with gentle waves rolling onto the shore and the sky filled with soft pink and orange hues. The rocky coastline and kelp forests are illuminated by the first rays of sunlight, with sea otters floating lazily in the water. High quality, detail-rich, 8K.
  - A photo-realistic landscape of the California foothills at midday, with steep hillsides covered in dry, golden native grasses. The rugged terrain is broken by clusters of live oaks with their deep green leaves, providing contrast and shade along the hills. High quality, detail-rich, 8K.

  - A photo-realistic landscape photograph of the California redwood forest in the late afternoon, with fog slowly creeping through the trees. The towering redwoods cast long shadows as the fog thickens, creating a moody and mysterious atmosphere. A hollow tree stands in the foreground, its dark interior adding an intriguing focal point to the scene. High quality, detail-rich, 8K.
  - An underwater photograph of a rocky underwater mountain off the coast of California, with kelp forests flowing along its rugged edges. The evening sunlight casts long, soft shadows across the mountain, while the deep blue of the ocean contrasts with the vibrant orange and pink corals. High quality, detail-rich, 8K.
  - A photo-realistic landscape photograph of San Rafael Bay at midday, with bright sunlight reflecting off the water. The sky is clear and blue, and the surrounding hills are lush with greenery. Boats are seen sailing on the calm waters, and the distant view of Mount Tamalpais rises prominently in the background. High quality, detail-rich, 8K.
  - A photo-realistic landscape of the California foothills at dawn, focusing on layered ridgelines covered in green native grasses and patches of white wildflowers. The pink and orange hues of the sunrise softly illuminate the landscape, creating a sense of depth and vastness. High quality, detail-rich, 8K.

  - A photo-realistic landscape photograph of the California redwood forest in autumn, where the undergrowth is ablaze with orange and brown hues, but the towering redwoods remain lush and green. The contrast between the seasonal colors below and the ever-present green of the redwoods above creates a striking scene of seasonal change within an ancient forest. High quality, detail-rich, 8K.
  - A close-up underwater photo of a sandy ocean bottom in California, bathed in clear, bright daylight. The soft golden sand contrasts sharply with the deeper blues of the surrounding ocean, while the rocky reefs in the background are dotted with vibrant corals. High quality, detail-rich, 8K.
  - A photo-realistic landscape photograph of Monterey Bay at noon, with bright, clear blue skies and the sun high overhead. The bay's turquoise waters shimmer in the sunlight, and the rugged coastline is dotted with rocks and seaweed. Seals bask on the rocky outcrops, while seabirds fly above. High quality, detail-rich, 8K.
