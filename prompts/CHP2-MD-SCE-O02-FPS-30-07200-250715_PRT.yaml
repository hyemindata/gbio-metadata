prompts:
  - A photo-realistic macro underwater photography of a vibrant tide pool on a California bay. Sunlight creates shimmering caustic patterns across the scene. A central, brilliant cluster of sun coral polyps unfolds like a bouquet of flowers, their petals a vivid, glowing orange. Delicate, waving tentacles of several emerald green anemones surround it. Patches of crusty deep purple coralline algae grow on the dark grey rock. High quality, detail-rich, 8K.
  - A photo-realistic landscape of a California bay with powerful waves crashing against a rocky headland. A large wave explodes in a plume of brilliant white foam and spray against the dark, wet charcoal-grey rocks. The churning water is a deep, turbulent teal-green. High quality, detail-rich, 8K.
  - A photo-realistic landscape of the foothills during a spectacular spring superbloom. The hills are an overwhelming, unbroken carpet of intense orange poppies flowing into seas of royal purple lupines, with very little bright green grass visible beneath the riot of color. High quality, detail-rich, 8K.
  - A photo-realistic close-up of turkey-tail fungi on a redwood log, creating an abstract pattern. The overlapping, fan-shaped shelves of fungus display shimmering, concentric rings of deep blue, forest green, tan, and rich brown, forming a mesmerizing, repeating pattern. High quality, detail-rich, 8K.

  - An underwater photograph looking up from the base of a submarine canyon. The sheer walls of the canyon are a dark bluish-grey rock, adorned with a vertical garden of vivid pink and purple gorgonian corals. The water at the top of the canyon is a bright, light-filled blue-green. High quality, detail-rich, 8K.
  - A photo-realistic landscape of a California bay under a sky filled with dramatic, backlit storm clouds. The clouds are a swirl of deep slate grey and bruised purple, with edges brilliantly illuminated in fiery orange by the setting sun. This light reflects on the choppy, steel-blue water. High quality, detail-rich, 8K.
  - A photo-realistic landscape of the foothills with a central focus on a flowering manzanita shrub. Its gnarled, smooth branches are a deep mahogany red, contrasting with its leathery olive-green leaves and clusters of delicate, bell-shaped pale pink and white flowers. The background is golden-tan dry grass. High quality, detail-rich, 8K.
  - A photo-realistic landscape of a redwood forest floor with a powerful triadic color contrast. A lush carpet of bright kelly green moss is punctuated by clusters of brilliant, fiery scarlet-red fungi and patches of deep violet-purple wild iris, all at the base of brown tree trunks. High quality, detail-rich, 8K.

  - An underwater photograph in a strong tidal surge. The water is full of motion, with long blades of golden-brown kelp and bright green surf grass pulled taut by the current. Small, orange corals cling tightly to grey rocks, as the blue water rushes past. High quality, detail-rich, 8K.
  - A photo-realistic landscape of a California bay with a brilliant double rainbow after a storm. The twin arcs of red, orange, yellow, green, and violet are reflected on the deep teal-blue water. Rain-washed cliffs are a saturated terracotta brown, with patches of vibrant green vegetation. High quality, detail-rich, 8K.
  - A photo-realistic landscape of the California foothills with a thick ground fog filling the valleys. The rolling tops of the hills, covered in bright golden-yellow poppies, emerge like islands from a sea of cool, dense white fog. The sky above is a clear, saturated azure blue. High quality, detail-rich, 8K.
  - A photo-realistic landscape photograph of a powerful waterfall in a redwood forest. A torrent of bright white water plunges down a cliff face covered in vibrant, dripping moss green, into a misty, churning pool below. The surrounding redwood trunks are a deep, wet reddish-brown. High quality, detail-rich, 8K. 

