prompts:
  - A photo-realistic landscape from a low viewpoint in the California foothills, showcasing intensely colored wildflowers. Foreground features electric magenta sticky monkey-flowers and brilliant sunshine yellow Mule's ears, with hillsides beyond covered in saturated spring green grasses under an intensely bright cyan blue sky. High quality, detail-rich, 8K.
  - A photo-realistic extreme close-up of a mature redwood cone lying on the forest floor. The woody scales display a rich texture with tones of polished mahogany brown. It rests on a bed of brilliantly colored mosses in shades of chartreuse yellow and bright emerald green. High quality, detail-rich, 8K.
  - An underwater photograph near a deep-sea hydrothermal vent, focusing on the vibrant mineral deposits. Chimneys are coated in brilliant sulphur yellow and fiery rust orange mineral precipitates, with mats of extremophile bacteria creating patches of creamy white and deep blood red. The surrounding water transitions from hazy grey-blue near the vents to inky black in the distance. High quality, detail-rich, 8K.
  - A photo-realistic landscape close-up of gumplant flowers in a California bay marsh. The bright, resinous flower heads are a saturated golden-yellow, set against their own waxy, deep olive-green leaves. The background is a soft-focus mix of pale tan mudflats and calm, light cerulean blue water. High quality, detail-rich, 8K.

  - A photo-realistic landscape from the foothills after a brief, intense rain shower, focused on a patch of redmaids flowers. Their intensely vibrant magenta-pink petals glisten with silver water droplets. They are surrounded by lush, saturated emerald green new grass on wet soil, under a clearing, deep cobalt blue sky. High quality, detail-rich, 8K.
  - A photo-realistic close-up landscape of a redwood log host to a spectacular bloom of chicken-of-the-woods fungus. The large, overlapping shelves are a brilliant, saturated canary yellow and bright sulphur orange, creating a stunning contrast with the deep, dark chocolate brown of the decaying log and surrounding forest green moss. High quality, detail-rich, 8K.
  - A macro underwater photograph focusing on the intricate latticework of a large, vibrant sea fan. The delicate branches are a saturated vibrant purple with hints of pale pink at the tips. It stands out sharply against the very deep, dark blue water of the open ocean. High quality, detail-rich, 8K.
  - A photo-realistic landscape of a California bay's rocky shoreline where waves crash, sending plumes of brilliant white spray into the air. The wet rocks are a slick, dark charcoal grey to near black, contrasting with patches of stubbornly clinging bright yellow-green coastal algae. The churning water is a deep teal blue under a dramatic, cloudy sky with streaks of stormy purple and fiery orange. High quality, detail-rich, 8K.

  - A photo-realistic landscape of the California foothills as a dramatic thunderstorm clears at sunset. The rain-soaked hills are an intensely saturated deep emerald green. Broken clouds, illuminated from below, glow with fiery golden-orange and deep crimson hues against a dark violet-grey sky. Puddles reflect the scene with silver and purple light. High quality, detail-rich, 8K.
  - A photo-realistic landscape of a fast-flowing river through a redwood forest. The water is a clear, bright teal green, rushing over submerged boulders covered in dark mossy green and slippery brownish-black algae. The riverbanks are lined with deep russet brown redwood trunks and carpets of vibrant jade green ferns. High quality, detail-rich, 8K.
  - An underwater photograph where the scene is dominated by a dense patch of strawberry anemones, their bodies a uniform, intense reddish-pink. They are nestled among waving blades of deep emerald-green surf grass on a dark charcoal grey rock, with bright blue-green water above. High quality, detail-rich, 8K.
  - A photo-realistic landscape focusing on a cluster of coastal dudleya succulents growing from a rocky bay crevice. Their fleshy rosettes display a stunning gradient from powdery silver-blue at the center to vibrant pinkish-red at the pointed tips. The surrounding rock is a dark, wet slate grey. High quality, detail-rich, 8K. 

