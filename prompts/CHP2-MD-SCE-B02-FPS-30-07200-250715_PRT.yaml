prompts:
  - A photo-realistic landscape of a California bay just after a storm at sunset. The sky is a dramatic swirl of intense rose-pink, fiery orange, and deep violet clouds. The turbulent water is a dark teal-blue, and the wet, jagged rocks on the shore are a slick, gleaming black. High quality, detail-rich, 8K.
  - A photo-realistic landscape contrasting the silky, delicate petals of wildflowers with the thorny stems of other plants in the foothills. Silky, deep purple lupine flowers are interspersed with the thorny, green stems of thistles and bright, waxy yellow poppies on a vibrant green hillside. High quality, detail-rich, 8K.
  - A photo-realistic landscape of a redwood grove in peak moss season. Every surface—the reddish-brown tree trunks, fallen logs, rocks—is draped in a thick, velvety, seamless carpet of intensely saturated, deep emerald green moss. High quality, detail-rich, 8K.
  - An underwater photograph from the base of a deep ocean canyon wall. The water is a deep, saturated sapphire blue. Faint light from above illuminates a vertical garden of electric pink and vibrant purple gorgonian corals, with patches of dark green algae clinging to the rock face. High quality, detail-rich, 8K.

  - A photo-realistic landscape of a bay just after a rainstorm, with a vibrant, full rainbow arching across the sky. The arc shows bands of red, orange, yellow, green, and blue, reflected on the deep blue water. The rain-washed cliffs are a saturated tan and dark green. High quality, detail-rich, 8K.
  - A photo-realistic landscape of the foothills during a superbloom, where the hills are an overwhelming, unbroken carpet of color. Vast fields of intense orange poppies flow into seas of royal purple lupines and swathes of bright yellow goldfields, with very little green grass visible. High quality, detail-rich, 8K.
  - A photo-realistic macro landscape photograph centered on a stunning redwood iris. Its intricate petals show velvety bands of deep royal purple, bright lavender, and veins of golden yellow and pure white, rising from sharp, sword-like green leaves. The background is a sun-dappled redwood forest floor with light filtering through the towering trees. High quality, detail-rich, 8K.
  - A photo-realistic macro landscape of a vibrant tide pool on a California bay. A central, bright orange starfish is surrounded by the tentacles of several emerald green anemones and patches of deep purple coralline algae on a dark grey rock. High quality, detail-rich, 8K.

  - A photo-realistic landscape of a California bay during the golden hour. The setting sun bathes the tan coastal cliffs in an intense, warm golden light, contrasting with the cool deep blue-green of the water, which has long, violet shadows stretching across it. High quality, detail-rich, 8K.
  - A photo-realistic landscape of the foothills contrasting the waxy, glossy leaves of a manzanita shrub with the fine, powdery soil it grows from. The shrub's leaves are a deep olive green and its bark a smooth mahogany red, set against the dusty, pale brown earth under a bright blue sky. High quality, detail-rich, 8K.
  - A photo-realistic landscape dominated by a cluster of pristine trillium flowers on the redwood forest floor. Their three large petals are a brilliant, pure white, forming a triangle above their waxy, deep jade-green leaves, set against the dark brown of the forest floor. High quality, detail-rich, 8K.
  - An underwater photograph of an incredibly dense invertebrate community on a rocky reef. There is no empty space, just a riotous, overlapping mosaic of hot pink strawberry anemones, fiery orange cup corals, and electric purple sea fans, interspersed with waving blades of bright green surf grass. High quality, detail-rich, 8K. 

